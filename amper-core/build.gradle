plugins {
    id 'java-library'
    id 'maven-publish'
}

dependencies {
    testImplementation platform("org.junit:junit-bom:${junitBomVersion}")
    testImplementation 'org.junit.jupiter:junit-jupiter'
}

tasks.named('test', Test) {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'skipped', 'failed'
    }
}

tasks.withType(JavaCompile).configureEach { compile ->
    // Baseline 2026-08-20: 0 unchecked/deprecation warnings on amper-core.
    // RobotCore compileAgainstFtcSdk stays without -Werror (issue #56).
    compile.options.compilerArgs += ['-Werror']
}

tasks.named('jar', Jar) {
    manifest {
        attributes(
                'Implementation-Title': 'AMPER Core',
                'Implementation-Version': archiveVersion,
                'Automatic-Module-Name': 'org.allsparks.amper'
        )
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            artifactId = 'amper-core'
            pom {
                name = 'AMPER Core'
                description = 'Pure-Java electrical awareness models for FTC AMPER. No Android or FTC SDK dependency.'
                url = 'https://github.com/The-Allsparks/AMPER'
                licenses {
                    license {
                        name = 'MIT License'
                        url = 'https://opensource.org/licenses/MIT'
                    }
                }
            }
        }
    }
}
