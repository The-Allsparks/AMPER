plugins {
    id 'java-library'
    id 'application'
}

dependencies {
    implementation project(':amper-core')
    testImplementation platform("org.junit:junit-bom:${junitBomVersion}")
    testImplementation 'org.junit.jupiter:junit-jupiter'
}

application {
    mainClass = 'org.allsparks.amper.tools.AmperAnalyze'
}

tasks.named('test', Test) {
    useJUnitPlatform()
}

tasks.named('jar', Jar) {
    manifest {
        attributes(
                'Implementation-Title': 'AMPER Analyze',
                'Implementation-Version': archiveVersion,
                'Main-Class': 'org.allsparks.amper.tools.AmperAnalyze'
        )
    }
}
