// Compile amper-ftc and amper-examples against official FTC SDK artifacts
// instead of amper-ftc-stubs. Default `check` still uses stubs so desktop
// unit tests and local builds do not require Android.
//
//   ./gradlew compileAgainstFtcSdk
//   ./gradlew compileAgainstFtcSdk -Pamper.skipFtcSdkCompile=true
//
// RobotCore 11.2.0 is published to Maven Central as an AAR (FtcRobotController
// v11.2 build.dependencies.gradle). No extra Maven repo or secret is required.
// Android types come from the public `com.google.android:android` compile jar
// so this remains a JavaCompile check, not an Android Gradle Plugin build.

configurations {
    ftcSdkAar {
        canBeConsumed = false
        canBeResolved = true
        visible = false
        transitive = false
    }
    androidCompileJar {
        canBeConsumed = false
        canBeResolved = true
        visible = false
        transitive = false
    }
}

repositories {
    mavenCentral()
}

dependencies {
    ftcSdkAar "org.firstinspires.ftc:RobotCore:${ftcSdkVersion}@aar"
    androidCompileJar 'com.google.android:android:4.1.1.4'
}

def ftcSdkJarsDir = layout.buildDirectory.dir('ftc-sdk-jars')
def robotCoreClassesJar = layout.buildDirectory.file("ftc-sdk-jars/RobotCore-${ftcSdkVersion}-classes.jar")

def extractFtcSdkJars = tasks.register('extractFtcSdkJars') {
    group = 'verification'
    description = "Extract classes.jar from FTC SDK ${ftcSdkVersion} AARs."
    inputs.files(configurations.ftcSdkAar)
    outputs.file(robotCoreClassesJar)
    onlyIf { findProperty('amper.skipFtcSdkCompile') != 'true' }
    doLast {
        def destDir = ftcSdkJarsDir.get().asFile
        project.delete(destDir)
        destDir.mkdirs()
        def artifacts = configurations.ftcSdkAar.resolvedConfiguration.resolvedArtifacts
        if (artifacts.isEmpty()) {
            throw new GradleException("No FTC SDK artifacts resolved. Expected RobotCore ${ftcSdkVersion} from Maven Central.")
        }
        artifacts.each { artifact ->
            logger.lifecycle("FTC SDK compile artifact: ${artifact.moduleVersion.id} (${artifact.file.name})")
            def outName = "${artifact.name}-${artifact.moduleVersion.id.version}-classes.jar"
            copy {
                from zipTree(artifact.file)
                include 'classes.jar'
                into destDir
                rename { outName }
            }
        }
        def extracted = robotCoreClassesJar.get().asFile
        if (!extracted.isFile()) {
            throw new GradleException("Failed to extract ${extracted.name} from RobotCore ${ftcSdkVersion}.")
        }
    }
}

def skipSdkCompile = {
    findProperty('amper.skipFtcSdkCompile') == 'true'
}

// Register after every project is configured. Calling project(':amper-ftc')
// during root evaluation deadlocks Gradle.
gradle.projectsEvaluated {
    def ftcProject = project(':amper-ftc')
    ftcProject.tasks.register('compileAgainstFtcSdk', JavaCompile) {
        group = 'verification'
        description = "Compile amper-ftc against org.firstinspires.ftc:RobotCore:${ftcSdkVersion} (not stubs)."
        dependsOn extractFtcSdkJars, ':amper-core:classes'
        onlyIf { !skipSdkCompile() }
        source = ftcProject.sourceSets.main.java
        destinationDirectory.set(ftcProject.layout.buildDirectory.dir('classes-ftc-sdk/java/main'))
        sourceCompatibility = '1.8'
        targetCompatibility = '1.8'
        options.encoding = 'UTF-8'
        options.compilerArgs += ['-Xlint:unchecked', '-Xlint:deprecation']
        classpath = files(
                project(':amper-core').sourceSets.main.output,
                robotCoreClassesJar,
                configurations.androidCompileJar
        )
        doFirst {
            logger.lifecycle("Compiling ${ftcProject.path} against FTC SDK ${ftcSdkVersion}")
            classpath.files.each { file ->
                logger.lifecycle("  classpath: ${file}")
            }
        }
    }

    def examplesProject = project(':amper-examples')
    examplesProject.tasks.register('compileAgainstFtcSdk', JavaCompile) {
        group = 'verification'
        description = "Compile amper-examples against org.firstinspires.ftc:RobotCore:${ftcSdkVersion} (not stubs)."
        dependsOn extractFtcSdkJars, ':amper-core:classes', ':amper-ftc:classes'
        onlyIf { !skipSdkCompile() }
        source = examplesProject.sourceSets.main.java
        destinationDirectory.set(examplesProject.layout.buildDirectory.dir('classes-ftc-sdk/java/main'))
        sourceCompatibility = '1.8'
        targetCompatibility = '1.8'
        options.encoding = 'UTF-8'
        options.compilerArgs += ['-Xlint:unchecked', '-Xlint:deprecation']
        classpath = files(
                project(':amper-core').sourceSets.main.output,
                project(':amper-ftc').sourceSets.main.output,
                robotCoreClassesJar,
                configurations.androidCompileJar
        )
        doFirst {
            logger.lifecycle("Compiling ${examplesProject.path} against FTC SDK ${ftcSdkVersion}")
            classpath.files.each { file ->
                logger.lifecycle("  classpath: ${file}")
            }
        }
    }
}

tasks.register('compileAgainstFtcSdk') {
    group = 'verification'
    description = "Compile amper-ftc and examples against official FTC SDK ${ftcSdkVersion}."
    dependsOn ':amper-ftc:compileAgainstFtcSdk', ':amper-examples:compileAgainstFtcSdk'
    onlyIf { !skipSdkCompile() }
    doLast {
        if (skipSdkCompile()) {
            logger.lifecycle('Skipped FTC SDK compile (amper.skipFtcSdkCompile=true).')
        }
    }
}
