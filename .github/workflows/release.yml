name: Release

# Third-party actions are pinned to full commit SHAs (issue #30).

on:
  push:
    tags:
      - "v*"

jobs:
  artifacts:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: The-Allsparks/allsparks-contracts
          path: allsparks-contracts
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Grant Gradle permissions
        run: chmod +x gradlew
      - name: Build publishable jars
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew :amper-core:build :amper-ftc:build --no-daemon
      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: amper-jars
          path: |
            amper-core/build/libs/*.jar
            amper-ftc/build/libs/*.jar
      # Publishing to GitHub Packages is opt-in after software gates pass.
      # Do not publish from this workflow until maintainers set secrets and
      # a version is tagged. Hardware validation is still required before
      # calling Phase 0/1 competition-validated.
