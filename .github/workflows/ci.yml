name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Grant Gradle permissions
        if: runner.os != 'Windows'
        run: chmod +x gradlew
      - name: Compile, test, examples, artifacts
        run: ./gradlew check javadocAll assembleReleaseArtifacts --no-daemon
      - name: Generate WPILOG fixture
        run: ./gradlew :amper-tools:generateWpiLogFixture --no-daemon
      - name: Upload WPILOG fixture
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: amper-wpilog-fixture-${{ matrix.os }}
          path: amper-tools/build/wpilog-fixture/amper-fixture.wpilog
      - name: Release artifact smoke
        run: ./gradlew :amper-core:jar :amper-ftc:jar :amper-core:sourcesJar :amper-core:javadocJar --no-daemon

  docs-structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Required documentation present
        run: |
          set -e
          test -f README.md
          test -f LICENSE
          test -f docs/install.md
          test -f docs/quickstart.md
          test -f docs/status/issue-matrix.md
          test -f docs/status/roadmap.md
          test -f docs/status/priority-ledger.md
          test -f docs/audits/initial-deep-audit.md
          test -f docs/validation/STATUS.md
          test -f docs/power-management/research.md
          test -f docs/power-management/architecture.md
          test -f docs/power-management/phases.md
          test -f docs/power-management/references.md
          test -f docs/release.md
          test -f docs/compatibility.md
          test -f docs/logging.md
          test -f docs/logging/advantagescope.md
          test -f docs/logging/field-selection.md
          test -f docs/logging/fixtures/amper-advantagescope-table.csv
          test -f docs/logging/fixtures/amper-advantagescope-table.schema.json
          test -f docs/logging/fixtures/amper-advantagescope-list.csv
