name: CodeQL

# Optional static analysis. Required merge check is the job name
# `Analyze Java` (see docs/release.md). Does not replace architecture
# tests or Hub validation.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 7 * * 1"

jobs:
  analyze:
    name: Analyze Java
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Grant Gradle permissions
        run: chmod +x gradlew
      - uses: github/codeql-action/init@v4
        with:
          languages: java
          build-mode: manual
      - name: Build JVM modules for CodeQL
        run: ./gradlew :amper-core:classes :amper-ftc:classes :amper-tools:classes --no-daemon
      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:java"
