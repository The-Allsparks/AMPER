name: CodeQL

# Optional static analysis. Required merge check is the job name
# `Analyze Java` (see docs/release.md). Does not replace architecture
# tests or Hub validation.
#
# Third-party actions are pinned to full commit SHAs (issue #30).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 7 * * 1"

jobs:
  analyze:
    name: Analyze Java
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: The-Allsparks/allsparks-contracts
          path: allsparks-contracts
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Grant Gradle permissions
        run: chmod +x gradlew
      - uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: java
          build-mode: manual
      - name: Build JVM modules for CodeQL
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew :amper-core:classes :amper-ftc:classes :amper-tools:classes --no-daemon
      - uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          category: "/language:java"
