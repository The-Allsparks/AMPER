plugins {
    id 'java-library'
}

dependencies {
    implementation project(':amper-ftc')
    compileOnly project(':amper-ftc-stubs')
}

// Default desktop compile uses FTC API stubs. CI also compiles examples
// against official RobotCore (see root `compileAgainstFtcSdk`). Examples
// are not an Android application and are not Control Hub validation.
tasks.named('jar', Jar) {
    manifest {
        attributes(
                'Implementation-Title': 'AMPER Examples',
                'Implementation-Version': archiveVersion
        )
    }
}
