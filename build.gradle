plugins {
    id 'com.diffplug.spotless' version '8.10.2' apply false
}

ext {
    amperGroup = 'org.allsparks'
    amperVersion = '0.1.0-rc.2'
    junitBomVersion = '5.10.2'
    contractsVersion = '0.1.0-SNAPSHOT'
    // FTC SDK 11.2.0 (DECODE 2025-2026). Source/target 1.8 matches
    // FtcRobotController v11.2 build.common.gradle compileOptions.
    // Accessed 2026-08-17 from
    // https://github.com/FIRST-Tech-Challenge/FtcRobotController/blob/v11.2/build.common.gradle
    ftcSdkVersion = '11.2.0'
}

subprojects { sub ->
    sub.group = rootProject.ext.amperGroup
    sub.version = rootProject.ext.amperVersion

    sub.pluginManager.withPlugin('java-library') {
        sub.java {
            sourceCompatibility = JavaVersion.VERSION_1_8
            targetCompatibility = JavaVersion.VERSION_1_8
            // contracts / PULSE are Java 11 bytecode. AMPER stays Java 8 for the
            // Hub; TeamCode's D8 already dexes Java 11 libraries. Do not raise
            // AMPER's target just to satisfy Gradle variant matching.
            disableAutoTargetJvm()
            withSourcesJar()
            withJavadocJar()
        }
        sub.repositories {
            mavenCentral()
            maven {
                name = 'GitHubPackagesAllsparksContracts'
                url = uri('https://maven.pkg.github.com/The-Allsparks/allsparks-contracts')
                credentials {
                    username = findProperty('gpr.user') ?: System.getenv('GPR_USERNAME') ?: System.getenv('GITHUB_ACTOR') ?: ''
                    password = findProperty('gpr.token') ?: System.getenv('GPR_TOKEN') ?: System.getenv('GITHUB_TOKEN') ?: ''
                }
            }
        }
        // Gradle 9 no longer puts the JUnit Platform launcher on the test
        // runtime classpath automatically.
        sub.dependencies {
            testRuntimeOnly platform("org.junit:junit-bom:${rootProject.ext.junitBomVersion}")
            testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
        }
        sub.tasks.named('javadoc', Javadoc) { javadoc ->
            javadoc.options.encoding = 'UTF-8'
            javadoc.options.addStringOption('Xdoclint:none', '-quiet')
            javadoc.failOnError = false
        }
        sub.tasks.withType(JavaCompile).configureEach { compile ->
            compile.options.encoding = 'UTF-8'
            compile.options.compilerArgs += ['-Xlint:unchecked', '-Xlint:deprecation']
        }
        if (sub.name != 'amper-ftc-stubs') {
            sub.apply plugin: 'com.diffplug.spotless'
            sub.spotless {
                java {
                    palantirJavaFormat()
                    target 'src/**/*.java'
                }
            }
        }
    }
}

tasks.register('test') {
    dependsOn ':amper-core:test', ':amper-ftc:test', ':amper-tools:test'
}

tasks.register('check') {
    dependsOn ':amper-core:check', ':amper-ftc:check', ':amper-examples:compileJava', ':amper-tools:check'
}

tasks.register('javadocAll') {
    dependsOn ':amper-core:javadoc', ':amper-ftc:javadoc', ':amper-tools:javadoc'
}

tasks.register('assembleReleaseArtifacts') {
    group = 'build'
    description = 'Assemble robot-facing jars: amper-core and amper-ftc only. Desktop tools are separate.'
    dependsOn ':amper-core:assemble', ':amper-ftc:assemble'
}

apply from: 'gradle/ftc-sdk-compile.gradle'
apply from: 'gradle/robot-artifacts.gradle'
